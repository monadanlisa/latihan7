<html lang="id">

  <style>
    :root {

      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
    }

    .header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Auth Screen */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
    }

    select:disabled {
      background-color: #f1f5f9;
    }

    .info-card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:active {
      background-color: var(--primary-dark);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    /* Quiz Screen */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .timer {
      font-weight: bold;
      color: var(--danger);
      background: #fef2f2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .question-box {
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.1s;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 24px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .grid-toggle-btn {
      background-color: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 12px;
      font-weight: 600;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
    }

    .grid-item {
      padding: 8px 0;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }

    .grid-item.answered {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid-item.active {
      border: 2px solid var(--warning);
    }

    /* Anti-Cheat Overlay */
    #warning-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    #warning-overlay h2 {
      color: var(--danger);
      margin-bottom: 12px;
    }

    #warning-overlay button {
      margin-top: 20px;
      width: auto;
      padding: 10px 24px;
    }

    /* Result Screen */
    .result-box {
      text-align: center;
      padding: 24px 0;
    }

    .score-badge {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 12px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .status-badge.lulus {
      background-color: #d1fae5;
      color: #065f46;
    }

    .status-badge.gagal {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<div id="app">
  <div class="header">SMPN 5 TANGERANG</div>

  <!-- 1. SCREEN AUTENTIKASI -->
  <div id="auth-screen" class="container">
    <h2 style="font-size: 1.1rem; margin-bottom: 4px; text-align: center;">Latihan 7 Informatika Kelas 9</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 16px;">Pengajar: Bu Mona</p>
    
    <div class="form-group">
      <label for="select-kelas">Pilih Kelas:</label>
      <select id="select-kelas" onchange="onKelasChange()">
        <option value="">-- Pilih Kelas --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="select-nama">Pilih Nama Siswa:</label>
      <select id="select-nama" disabled onchange="onNamaChange()">
        <option value="">-- Pilih Nama --</option>
      </select>
    </div>

    <div id="student-info" class="info-card hidden"></div>

    <button id="btn-start" class="btn-primary" disabled onclick="startQuiz()">Mulai Latihan 7</button>
  </div>

  <!-- 2. SCREEN KUIS -->
  <div id="quiz-screen" class="container hidden">
    <div class="quiz-header">
      <span id="question-progress" style="font-weight: 600; font-size: 0.9rem;">Soal 1 dari 30</span>
      <div class="timer" id="timer-display">45:00</div>
    </div>

    <div class="question-box" id="question-text">Loading Soal...</div>

    <div class="options-container" id="options-box"></div>

    <div class="nav-buttons">
      <button class="btn-primary" style="background:#64748b" id="btn-prev" onclick="prevQuestion()">Kembali</button>
      <button class="btn-primary" id="btn-next" onclick="nextQuestion()">Lanjut</button>
    </div>

    <button class="grid-toggle-btn" onclick="toggleGrid()">Navigasi Soal (Grid)</button>

    <div id="grid-box" class="grid-container hidden"></div>

    <button class="btn-primary" style="background: var(--success); margin-top: 20px;" onclick="confirmSubmit()">Selesaikan Latihan</button>
  </div>

  <!-- 3. SCREEN HASIL -->
  <div id="result-screen" class="container hidden">
    <div class="result-box">
      <h3>Hasil Latihan 7 Informatika</h3>
      <div id="result-score" class="score-badge">0</div>
      <div id="result-status" class="status-badge">TIDAK LULUS</div>

      <div class="info-card" id="result-summary" style="margin-top:20px; text-align:left;"></div>

      <button class="btn-primary" style="margin-top: 16px;" onclick="resetToLogin()">Kembali ke Halaman Utama</button>
    </div>
  </div>
</div>

<!-- OVERLAY PERINGATAN KECURANGAN -->
<div id="warning-overlay">

</div>

  function populateKelasDropdown() {
    const kelasSet = [...new Set(studentData.map(s => s.kelas))];
    const selectKelas = document.getElementById('select-kelas');
    selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    kelasSet.forEach(k => {
      selectKelas.innerHTML += `<option value="${k}">${k}</option>`;
    });
  }

  function onKelasChange() {
    const kelas = document.getElementById('select-kelas').value;
    const selectNama = document.getElementById('select-nama');
    const infoCard = document.getElementById('student-info');
    const btnStart = document.getElementById('btn-start');

    selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
    infoCard.classList.add('hidden');
    btnStart.disabled = true;

    if (!kelas) {
      selectNama.disabled = true;
      return;
    }

    const filteredStudents = studentData.filter(s => s.kelas === kelas);
    filteredStudents.forEach(s => {
      selectNama.innerHTML += `<option value="${s.nama}">${s.nama}</option>`;
    });
    selectNama.disabled = false;
  }

  function onNamaChange() {
    const kelas = document.getElementById('select-kelas').value;
    const nama = document.getElementById('select-nama').value;
    const infoCard = document.getElementById('student-info');
    const btnStart = document.getElementById('btn-start');

    if (!nama) {
      infoCard.classList.add('hidden');
      btnStart.disabled = true;
      return;
    }

    currentStudent = studentData.find(s => s.kelas === kelas && s.nama === nama);

    if (currentStudent) {
      infoCard.innerHTML = `
        <strong>Mata Pelajaran:</strong> Informatika (Logika Python)<br>
        <strong>Sekolah:</strong> SMPN 5 Tangerang (Bu Mona)<br>
        <strong>Nilai Awal:</strong> ${currentStudent.nilaiAwal}<br>
        <strong>Target KKM:</strong> ${KKM}<br>
        <strong>Status:</strong> Siap mengerjakan Latihan 7
      `;
      infoCard.classList.remove('hidden');
      btnStart.disabled = false;
      btnStart.innerText = "Mulai Latihan 7";
    }
  }

  function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    requestFullScreen();

    // Acak 60 soal dan ambil 30 soal saja untuk dimainkan
    const shuffledRaw = shuffleArray(rawQuizData).slice(0, TOTAL_SOAL_DIUJI);
    
    quizQuestions = shuffledRaw.map(q => {
      let optionsWithKey = q.opt.map((optText, index) => ({
        text: optText,
        isCorrect: index === q.ans
      }));
      let shuffledOptions = shuffleArray(optionsWithKey);
      return { q: q.q, options: shuffledOptions };
    });

    userAnswers = {};
    timeRemaining = WAKTU_KUIS_MENIT * 60;
    currentQuestionIdx = 0;
    violationCount = 0;

    saveStateToLocalStorage();
    initQuizUI();
  }

  function initQuizUI() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    renderQuestion();
    renderGrid();
    startTimer();
  }

  function renderQuestion() {
    const qData = quizQuestions[currentQuestionIdx];
    document.getElementById('question-progress').innerText = `Soal ${currentQuestionIdx + 1} dari ${TOTAL_SOAL_DIUJI}`;
    document.getElementById('question-text').innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

    const optionsBox = document.getElementById('options-box');
    optionsBox.innerHTML = '';

    qData.options.forEach((opt, idx) => {
      const isSelected = userAnswers[currentQuestionIdx] === idx;
      const btn = document.createElement('button');
      btn.className = `option-btn ${isSelected ? 'selected' : ''}`;
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(idx);
      optionsBox.appendChild(btn);
    });

    document.getElementById('btn-prev').style.visibility = currentQuestionIdx === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').innerText = currentQuestionIdx === TOTAL_SOAL_DIUJI - 1 ? 'Selesai' : 'Lanjut';
    
    updateGridUI();
  }

  function selectOption(optionIndex) {
    userAnswers[currentQuestionIdx] = optionIndex;
    saveStateToLocalStorage();
    renderQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIdx < TOTAL_SOAL_DIUJI - 1) {
      currentQuestionIdx++;
      renderQuestion();
    } else {
      confirmSubmit();
    }
  }

  function prevQuestion() {
    if (currentQuestionIdx > 0) {
      currentQuestionIdx--;
      renderQuestion();
    }
  }

  function renderGrid() {
    const gridBox = document.getElementById('grid-box');
    gridBox.innerHTML = '';
    for (let i = 0; i < TOTAL_SOAL_DIUJI; i++) {
      const item = document.createElement('div');
      item.id = `grid-item-${i}`;
      item.className = 'grid-item';
      item.innerText = i + 1;
      item.onclick = () => {
        currentQuestionIdx = i;
        renderQuestion();
      };
      gridBox.appendChild(item);
    }
    updateGridUI();
  }

  function updateGridUI() {
    for (let i = 0; i < TOTAL_SOAL_DIUJI; i++) {
      const item = document.getElementById(`grid-item-${i}`);
      if (!item) continue;
      
      item.className = 'grid-item';
      if (userAnswers[i] !== undefined) item.classList.add('answered');
      if (i === currentQuestionIdx) item.classList.add('active');
    }
  }

  function toggleGrid() {
    const gridBox = document.getElementById('grid-box');
    gridBox.classList.toggle('hidden');
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeRemaining--;
      saveStateToLocalStorage();

      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('timer-display').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("Waktu habis! Kuis akan otomatis tersubmit.");
        submitQuiz(true);
      }
    }, 1000);
  }

  function saveStateToLocalStorage() {
    const sessionData = {
      student: currentStudent,
      questions: quizQuestions,
      answers: userAnswers,
      time: timeRemaining,
      questionIdx: currentQuestionIdx,
      violations: violationCount
    };
    localStorage.setItem('latihan7_quiz_state', JSON.stringify(sessionData));
  }

  function checkLocalStorageOnLoad() {
    const saved = localStorage.getItem('latihan7_quiz_state');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (confirm(`Ditemukan sesi latihan aktif untuk ${data.student.nama}. Lanjutkan pengerjaan?`)) {
          currentStudent = data.student;
          quizQuestions = data.questions;
          userAnswers = data.answers;
          timeRemaining = data.time;
          currentQuestionIdx = data.questionIdx;
          violationCount = data.violations || 0;
          initQuizUI();
        } else {
          localStorage.removeItem('latihan7_quiz_state');
        }
      } catch (e) {
        localStorage.removeItem('latihan7_quiz_state');
      }
    }
  }

  function setupSecurityListeners() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
      }
    });

    window.addEventListener('blur', triggerViolation);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) triggerViolation();
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && !document.getElementById('quiz-screen').classList.contains('hidden')) {
        triggerViolation();
      }
    });
  }

  function requestFullScreen() {
    const doc = document.documentElement;
    if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
    else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();
    else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
  }

  function triggerViolation() {
    if (document.getElementById('quiz-screen').classList.contains('hidden')) return;

    violationCount++;
    saveStateToLocalStorage();

    if (violationCount >= 2) {
      alert("Anda telah melanggar aturan keamanan kuis sebanyak 2 kali. Sistem akan otomatis mengirimkan jawaban Anda!");
      submitQuiz(true);
    } else {
      document.getElementById('warning-text').innerText = `Pelanggaran Terdeteksi (${violationCount}/2)! Dilarang berpindah aplikasi, split screen, atau keluar dari fullscreen.`;
      document.getElementById('warning-overlay').style.display = 'flex';
    }
  }

  function dismissWarning() {
    document.getElementById('warning-overlay').style.display = 'none';
    requestFullScreen();
  }

  function confirmSubmit() {
    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < TOTAL_SOAL_DIUJI) {
      if (!confirm(`Anda baru menjawab ${answeredCount} dari ${TOTAL_SOAL_DIUJI} soal. Yakin ingin menyelesaikan latihan?`)) {
        return;
      }
    } else {
      if (!confirm("Yakin ingin menyelesaikan latihan ini?")) {
        return;
      }
    }
    submitQuiz(false);
  }

  function submitQuiz(isForceSubmit = false) {
    clearInterval(timerInterval);

    let correctCount = 0;
    quizQuestions.forEach((q, idx) => {
      const selectedOptionIdx = userAnswers[idx];
      if (selectedOptionIdx !== undefined && q.options[selectedOptionIdx].isCorrect) {
        correctCount++;
      }
    });

    const finalScore = Math.round((correctCount / TOTAL_SOAL_DIUJI) * 100);

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('result-score').innerText = finalScore;

    const summaryBox = document.getElementById('result-summary');
    summaryBox.innerHTML = `Mengirim data jawaban ke server, mohon tunggu...`;

    const payload = {
      nama: currentStudent.nama,
      kelas: currentStudent.kelas,
      nilaiAwal: currentStudent.nilaiAwal,
      nilaiLatihan: finalScore,
      kategori: "Latihan 7"
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      const isLulus = finalScore >= KKM;
      const finalStatus = isLulus ? "LULUS" : "BELUM LULUS";

      document.getElementById('result-status').innerText = finalStatus;
      document.getElementById('result-status').className = `status-badge ${isLulus ? 'lulus' : 'gagal'}`;

      summaryBox.innerHTML = `
        <strong>Siswa:</strong> ${currentStudent.nama} (${currentStudent.kelas})<br>
        <strong>Nilai Latihan 7:</strong> ${finalScore}<br>
        <strong>Target KKM:</strong> ${KKM}<br>
        <strong>Status:</strong> ${finalStatus}<br><br>
        <small>*Data hasil latihan telah berhasil tersimpan di Google Sheets Bu Mona.</small>
      `;

      localStorage.removeItem('latihan7_quiz_state');
    })
    .catch(err => {
      summaryBox.innerHTML = `Terjadi kesalahan saat menyimpan ke Google Sheets: ${err}. Nilai Anda pada sesi ini: <strong>${finalScore}</strong>`;
      localStorage.removeItem('latihan7_quiz_state');
    });
  }

  function resetToLogin() {
    location.reload();
  }
</script>
